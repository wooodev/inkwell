[project]
name = "inkwell"
version = "0.1.0"
description = "블로그·커뮤니티 API 서비스"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"
